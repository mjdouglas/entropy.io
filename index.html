<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael Douglas is a software engineer based in New York.">
    <title>Michael Douglas | Software Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&display=swap"></noscript>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #palette-info {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        #palette-info.visible {
            opacity: 1;
        }
        #audio-player {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            width: 300px;
            box-sizing: border-box;
        }
        .player-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }
        .player-btn:hover {
            color: rgba(255, 255, 255, 1);
        }
        .player-btn svg {
            width: 100%;
            height: 100%;
        }
        #track-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        #track-song {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #track-artist {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        #spotify-link {
            color: rgba(255, 255, 255, 0.4);
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }
        #spotify-link:hover {
            color: #1db954;
        }
        #spotify-link svg {
            width: 100%;
            height: 100%;
        }
        #audio-player.no-audio {
            opacity: 0.5;
        }
        #audio-player.no-audio .player-btn {
            cursor: not-allowed;
        }
        #theme-toast {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0;
        }
        #theme-toast.visible {
            animation: toastFade 2.5s ease-out forwards;
        }
        @keyframes toastFade {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
        .nav-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 2rem;
            cursor: pointer;
            padding: 20px;
            transition: color 0.2s, transform 0.08s ease;
            z-index: 100;
        }
        .nav-arrow:hover {
            color: rgba(255,255,255,0.7);
        }
        #prev-palette { left: 10px; }
        #next-palette { right: 10px; }
        #site-header {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
        }
        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
        .header-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            color: rgba(255,255,255,0.25);
            text-transform: lowercase;
            margin-top: 6px;
        }
        #contact-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: rgba(255,255,255,0.4);
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
        }
        #contact-btn:hover {
            color: rgba(255,255,255,0.7);
            border-color: rgba(255,255,255,0.4);
        }
        #contact-btn svg {
            display: none;
            width: 18px;
            height: 18px;
        }
        #contact-btn span {
            display: inline;
        }
        #mode-toggle {
            position: fixed;
            top: 24px;
            left: 24px;
            display: inline-flex;
            background: rgba(16, 16, 16, 0.9);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            padding: 4px;
            z-index: 120;
            gap: 4px;
        }
        #mobile-mode-toggle {
            position: fixed;
            top: auto;
            left: calc(env(safe-area-inset-left) + 12px);
            bottom: calc(env(safe-area-inset-bottom) + var(--mobile-mode-anchor, 24px));
            display: none;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            padding: 0;
            z-index: 120;
            background: rgba(24, 32, 44, 0.92);
            border: 1px solid rgba(120, 170, 255, 0.5);
            border-radius: 999px;
            color: rgba(214, 231, 255, 0.95);
            box-shadow: 0 0 0 1px rgba(70, 125, 220, 0.16), 0 8px 18px rgba(0, 0, 0, 0.35);
            transition: bottom 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.08s ease;
        }
        #mobile-mode-toggle.active {
            background: rgba(78, 128, 220, 0.32);
            border-color: rgba(160, 195, 255, 0.85);
            color: rgba(245, 250, 255, 1);
        }
        body.manual-mode #mobile-mode-toggle {
            bottom: calc(env(safe-area-inset-bottom) + var(--mobile-controls-offset, 0px) + 18px);
        }
        .mode-btn {
            border: none;
            border-radius: 999px;
            background: transparent;
            color: rgba(255,255,255,0.45);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.08s ease;
        }
        .mode-btn.active {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.95);
        }
        #manual-controls {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: min(340px, calc(100vw - 32px));
            background: rgba(14, 14, 14, 0.94);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            padding: 14px;
            z-index: 130;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        }
        #manual-controls.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        .manual-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .manual-row:last-child {
            margin-bottom: 0;
        }
        #manual-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.52rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.52);
            margin-bottom: 10px;
            min-height: 0.9rem;
        }
        .face-btn,
        .modifier-btn,
        .action-btn,
        #apply-notation {
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.82);
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.64rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 9px 10px;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.08s ease;
        }
        .face-btn:hover,
        .modifier-btn:hover,
        .action-btn:hover,
        #apply-notation:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.98);
        }
        .face-btn,
        .modifier-btn {
            flex: 1;
        }
        .modifier-btn.active {
            background: rgba(93, 149, 255, 0.28);
            border-color: rgba(138, 178, 255, 0.7);
            color: rgba(235, 243, 255, 1);
        }
        .action-btn {
            flex: 1;
        }
        .mode-btn:active,
        .mode-btn.is-pressed,
        .face-btn:active,
        .face-btn.is-pressed,
        .modifier-btn:active,
        .modifier-btn.is-pressed,
        .action-btn:active,
        .action-btn.is-pressed,
        #apply-notation:active,
        #apply-notation.is-pressed {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.48);
            color: rgba(255,255,255,1);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.16), 0 0 14px rgba(255,255,255,0.14);
        }
        .nav-arrow:active,
        .nav-arrow.is-pressed {
            color: rgba(255,255,255,0.92);
            text-shadow: 0 0 14px rgba(255,255,255,0.45);
        }
        #notation-input {
            flex: 1;
            min-width: 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: rgba(255,255,255,0.92);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            padding: 8px 10px;
        }
        #notation-input::placeholder {
            color: rgba(255,255,255,0.34);
        }
        #apply-notation {
            width: 100px;
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            #audio-player {
                width: min(264px, calc(100vw - 110px));
                padding: 10px 12px;
                gap: 10px;
                border-radius: 10px;
            }
            .player-btn {
                width: 28px;
                height: 28px;
            }
            #track-song {
                font-size: 0.62rem;
                letter-spacing: 0.08em;
            }
            #track-artist {
                font-size: 0.5rem;
                letter-spacing: 0.06em;
            }
            #spotify-link {
                width: 18px;
                height: 18px;
            }
            #contact-btn {
                padding: 8px;
            }
            #contact-btn svg {
                display: block;
            }
            #contact-btn span {
                display: none;
            }
            #mode-toggle {
                display: none;
            }
            #mobile-mode-toggle {
                display: inline-flex;
            }
            #manual-controls {
                right: 12px;
                left: 12px;
                bottom: 12px;
                width: auto;
                border-radius: 10px;
                padding: 10px;
            }
            #manual-status,
            .manual-row[data-mobile="hide"] {
                display: none;
            }
            .manual-row {
                margin-bottom: 6px;
            }
            .manual-row:last-child {
                margin-bottom: 0;
            }
            .manual-row.face-row {
                flex-wrap: wrap;
            }
            .manual-row.face-row .face-btn {
                flex: 1 1 calc(33.333% - 6px);
                min-width: 0;
                padding: 8px 6px;
                font-size: 0.62rem;
                letter-spacing: 0.08em;
            }
            .face-btn,
            .modifier-btn,
            .action-btn,
            #apply-notation {
                min-height: 36px;
                font-size: 0.62rem;
                padding: 8px 7px;
            }
            .manual-row.action-row {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }
            .manual-row.action-row .action-btn {
                width: 100%;
            }
            .manual-row.action-row[data-cols="2"] {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .manual-row.action-row[data-mobile="hide"] {
                display: none;
            }
        }
        #contact-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #contact-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        #contact-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 32px;
            z-index: 201;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }
        #contact-modal.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        #contact-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px 16px 0 0;
            padding: 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        #contact-sheet.visible {
            transform: translateY(0);
        }
        .contact-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-bottom: 24px;
            text-align: center;
        }
        .contact-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }
        .contact-option:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85);
        }
        .contact-option svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .email-row {
            display: flex;
            gap: 8px;
        }
        .email-row .contact-option {
            flex: 1;
        }
        .copy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
        }
        .copy-btn svg {
            width: 18px;
            height: 18px;
        }
        .copy-btn.copied {
            color: rgba(100,255,150,0.8);
            border-color: rgba(100,255,150,0.3);
        }
        @media (min-width: 769px) {
            #contact-sheet { display: none; }
        }
        @media (max-width: 768px) {
            #contact-modal { display: none; }
        }
    </style>
</head>

    <script>
        (() => {
            const contactBtn = document.getElementById('contact-btn');
            const overlay = document.getElementById('contact-overlay');
            const modal = document.getElementById('contact-modal');
            const sheet = document.getElementById('contact-sheet');

            function isMobile() {
                return window.innerWidth <= 768;
            }

            function openContact() {
                overlay.classList.add('visible');
                if (isMobile()) {
                    sheet.classList.add('visible');
                } else {
                    modal.classList.add('visible');
                }
            }

            function closeContact() {
                overlay.classList.remove('visible');
                modal.classList.remove('visible');
                sheet.classList.remove('visible');
            }

            contactBtn.addEventListener('click', openContact);
            overlay.addEventListener('click', closeContact);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeContact();
                }
            });

            document.querySelectorAll('.copy-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const email = btn.dataset.email;
                    navigator.clipboard.writeText(email).then(() => {
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                });
            });
        })();
    </script>
    <script type="module" src="./js/main.js"></script>
